<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreanoStore | Curated Directory</title>
    <link rel="stylesheet" href="Style.css"
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2092284334287864" crossorigin="anonymous"></script>
</head>
<body>

    <main class="store-container">
        <header class="store-header">
            <h1>CreanoStore</h1>
            <p class="subtitle">curated partner directory</p>
        </header>

        <nav class="category-tabs">
            <button class="tab-btn active" onclick="switchCategory('all', event)">all</button>
            <button class="tab-btn" onclick="switchCategory('hardware', event)">hardware</button>
            <button class="tab-btn" onclick="switchCategory('software', event)">software</button>
        </nav>

        <section id="product-grid" class="product-grid">
            <!-- Products are injected dynamically from script.js for easy mobile updates -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
